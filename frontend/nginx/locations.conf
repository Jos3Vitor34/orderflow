location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# Docker DNS is resolved again after API container replacements.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 2s;
set $orderflow_api api:8000;
proxy_connect_timeout 5s;
proxy_read_timeout 15s;
proxy_send_timeout 15s;
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
# FastAPI canonical-path redirects remain relative, including behind external TLS.
proxy_redirect http://$host/ /;

# Never apply the SPA fallback to API or backend health responses.
location = /api { proxy_pass http://$orderflow_api$request_uri; }
location ^~ /api/ { proxy_pass http://$orderflow_api$request_uri; }
location = /health { proxy_pass http://$orderflow_api$request_uri; }
location = /health/live { proxy_pass http://$orderflow_api$request_uri; }
location = /health/ready { proxy_pass http://$orderflow_api$request_uri; }

location ^~ /assets/ {
    try_files $uri =404;
    include /etc/nginx/orderflow/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location = /index.html {
    include /etc/nginx/orderflow/security-headers.conf;
    add_header Cache-Control "no-store" always;
}
location / { try_files $uri $uri/ /index.html; }
