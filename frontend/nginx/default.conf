log_format orderflow escape=json '{"service":"orderflow-frontend","method":"$request_method","path":"$uri","status":$status,"correlation_id":"$upstream_http_x_correlation_id"}';
map $scheme $orderflow_hsts { default ""; https "max-age=31536000"; }

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;
    access_log /dev/stdout orderflow;
    error_log /dev/stderr warn;
    include /etc/nginx/orderflow/security-headers.conf;
    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    include /etc/nginx/orderflow/locations.conf;
}
