name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint, types, tests, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Vitest
        run: npm run test
      - name: Vite build
        run: npm run build

  static-and-unit:
    name: Lint, types, and local tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install project and quality tools
        run: |
          python -m pip install --upgrade 'pip>=26.2,<27'
          python -m pip install --group dev .
      - name: Ruff lint and security rules
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .
      - name: Mypy
        run: mypy
      - name: Unit and in-memory tests
        run: pytest -m 'not integration' -p no:cacheprovider
        env:
          JWT_SECRET_KEY: ci-only-secret-key-that-is-at-least-32-characters
      - name: Compose syntax
        run: docker compose config --quiet

  postgres-integration:
    name: PostgreSQL integration and branch coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: orderflow_ci
          POSTGRES_USER: orderflow
          POSTGRES_PASSWORD: ci-only-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orderflow -d orderflow_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.2.9-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://orderflow:ci-only-postgres-password@localhost:5432/orderflow_ci
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-only-secret-key-that-is-at-least-32-characters
      RUN_POSTGRES_INTEGRATION_TESTS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install project and test tools
        run: |
          python -m pip install --upgrade 'pip>=26.2,<27'
          python -m pip install --group dev .
      - name: Upgrade, isolated downgrade, and metadata check
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          alembic check
      - name: Complete suite with branch coverage
        run: >-
          pytest -p no:cacheprovider
          --cov=app --cov-branch
          --cov-report=term-missing:skip-covered
          --cov-report=xml --cov-report=html
          --cov-fail-under=90
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/
          if-no-files-found: ignore
          retention-days: 14
