name: Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '37 7 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security
    if: always()
    needs: [frontend-dependencies, dependencies, secrets, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every security job to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os

          results = json.loads(os.environ["JOB_RESULTS"])
          assert all(job["result"] == "success" for job in results.values()), results
          PY

  frontend-dependencies:
    name: Frontend dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit frontend dependencies
        run: npm audit

  dependencies:
    name: Installed dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install runtime and development dependencies
        run: |
          python -m pip install --upgrade 'pip>=26.2,<27'
          python -m pip install --group dev .
      - name: Audit installed distributions
        run: python -m pip_audit --local --progress-spinner off
      - name: Static application security rules
        run: ruff check app --select S

  secrets:
    name: Git history and working tree
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks 8.30.1
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLo gitleaks_8.30.1_linux_x64.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLo gitleaks_checksums.txt \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep 'gitleaks_8.30.1_linux_x64.tar.gz' gitleaks_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          chmod +x gitleaks
      - name: Scan all available commits
        run: '"$RUNNER_TEMP/gitleaks" git . --redact=100 --no-banner'
      - name: Scan checkout including workflow changes
        run: '"$RUNNER_TEMP/gitleaks" dir . --redact=100 --no-banner'

  image:
    name: Docker vulnerability scan and SBOM (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: api
            context: .
          - target: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build runtime image
        run: docker build --pull -t orderflow-${{ matrix.target }}:${{ github.sha }} ${{ matrix.context }}
      - name: Scan HIGH and CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: orderflow-${{ matrix.target }}:${{ github.sha }}
          version: v0.74.0
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml
          exit-code: '1'
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8 # v0.36.0
        with:
          image-ref: orderflow-${{ matrix.target }}:${{ github.sha }}
          version: v0.74.0
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: '0'
      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: image-sbom-${{ matrix.target }}
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 14
