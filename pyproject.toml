[project]
name = "orderflow-api"
version = "0.1.0"
description = "Backend API for order management and automation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "celery[redis]>=5.6,<6",
    "email-validator>=2.2,<3",
    "fastapi>=0.115,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "pwdlib[argon2]>=0.3,<1",
    "pyjwt>=2.10,<3",
    "python-multipart>=0.0.20,<1",
    "redis>=6.4,<7",
    "sqlalchemy>=2.0,<3",
    "stripe>=15.6.1,<16",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pytest>=8.4,<10",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "integration: tests that require external infrastructure",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 88
exclude = [".git", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
